name: Evento semanal
description: Planeje o evento da semana e registre o resultado depois.
title: "[Evento]: "
labels: ["evento"]
body:
  - type: markdown
    attributes:
      value: |
        Preencha o planejamento antes do evento e volte para completar o resultado depois.
        O histórico destas issues é o que decide qual modo vira permanente.
  - type: input
    id: kind
    attributes:
      label: Tipo de evento
      placeholder: "Ex.: A lava sobe"
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Mapa usado
      description: "Nome da pasta em infra/runtime/event-maps/"
      placeholder: "Ex.: lava-sobe"
    validations:
      required: true
  - type: input
    id: schedule
    attributes:
      label: Data e horário
      placeholder: "Ex.: sexta 12/09, 20h"
    validations:
      required: true
  - type: input
    id: released
    attributes:
      label: Modos pausados para liberar RAM
      placeholder: "Ex.: bedwars, pvp"
    validations:
      required: false
  - type: textarea
    id: rules
    attributes:
      label: Regras do evento
      placeholder: "Como vence, o que é proibido, o que acontece com quem for eliminado..."
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Antes de anunciar
      options:
        - label: Rodei o evento inteiro sozinho antes de convidar alguém
        - label: A cópia limpa do mapa foi testada
        - label: O mecanismo do evento roda sozinho, sem eu digitar comando
        - label: Eliminado vira espectador ou volta ao lobby
        - label: O anti-cheat tem exceção para a minha conta em criativo
        - label: As regras estão escritas no Discord
        - label: O backup de ontem existe e está fora do servidor
  - type: markdown
    attributes:
      value: "---\n### Preencher depois do evento"
  - type: input
    id: peak
    attributes:
      label: Pico de jogadores simultâneos
      placeholder: "Ex.: 18 (pico normal do dia: 11)"
    validations:
      required: false
  - type: input
    id: retention
    attributes:
      label: Quantos ficaram até o fim / voltaram no dia seguinte
      placeholder: "Ex.: 12 até o fim, 7 voltaram"
    validations:
      required: false
  - type: textarea
    id: problems
    attributes:
      label: O que quebrou ou confundiu
      placeholder: "Bugs, regras mal explicadas, problemas específicos do Bedrock..."
    validations:
      required: false
  - type: dropdown
    id: verdict
    attributes:
      label: Vale repetir?
      options:
        - "Sim, e é candidato a modo permanente"
        - "Sim, mas precisa de ajustes"
        - "Não"
    validations:
      required: false
