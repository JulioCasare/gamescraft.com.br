name: GcMenus
version: 1.0.0
main: br.com.gamescraft.menus.GcMenus
api-version: '1.21'
description: Menus de bau dos bonecos do lobby do Game Craft
author: Game Craft
commands:
  npcskin:
    description: Copia a skin de um jogador online para o boneco mais proximo
    usage: /npcskin <jogador>
    permission: gcmenus.npcskin
  npcitem:
    description: Poe na mao do boneco mais proximo o item que voce esta segurando
    usage: /npcitem [esquerda]
    permission: gcmenus.npcskin
  torres:
    description: Varre o mapa e refaz a lista de torres protegidas
    usage: /torres
    permission: gcmenus.npcskin
permissions:
  gcmenus.npcskin:
    description: Permite mexer nos bonecos
    default: op
