name: GcMenus
version: 1.0.0
main: br.com.gamescraft.menus.GcMenus
# 1.20 e nao 1.21: o Bed Wars roda em 1.20.4 e recusa plugin que peca API mais
# nova que a dele. Declarar API velha nao tira nada — o jar continua rodando
# igual nos servidores novos, e as peças que so existem na 26.2 vivem em classes
# que so o modo megagames carrega.
api-version: '1.20'
description: Menus de bau dos bonecos do lobby do Game Craft
author: Game Craft
commands:
  npcskin:
    description: Copia a skin de um jogador online para o boneco mais proximo
    usage: /npcskin <jogador>
    permission: gcmenus.npcskin
  npcitem:
    description: Poe na mao do boneco mais proximo o item que voce esta segurando
    usage: /npcitem [esquerda]
    permission: gcmenus.npcskin
  torres:
    description: Varre o mapa e refaz a lista de torres protegidas
    usage: /torres
    permission: gcmenus.npcskin
  castelos:
    description: Repinta o chao dos castelos com a cor do sinalizador de cada um
    usage: /castelos
    permission: gcmenus.npcskin
  neutro:
    description: Devolve ao neutro todas as torres menos as dos castelos
    usage: /neutro
    permission: gcmenus.npcskin
  espera:
    description: Marca onde voce esta como o saguao entre partidas
    usage: /espera
    permission: gcmenus.npcskin
  saguao:
    description: Leva voce ao saguao, a sala de votacao
    usage: /saguao
  forcestart:
    description: Comeca a partida agora, sem esperar juntar gente
    usage: /forcestart
    permission: gcmenus.npcskin
  setup:
    description: Leva voce a uma arena em criativo para construir o mapa
    usage: /setup <arena>
    permission: gcmenus.npcskin
  save:
    description: Guarda a arena onde voce esta como o mapa oficial dela
    usage: /save
    permission: gcmenus.npcskin
  reset:
    description: Devolve a arena onde voce esta ao mapa guardado
    usage: /reset
    permission: gcmenus.npcskin
  arenas:
    description: Lista as arenas e diz quais ja tem modelo guardado
    usage: /arenas
    permission: gcmenus.npcskin
permissions:
  gcmenus.npcskin:
    description: Permite mexer nos bonecos
    default: op
