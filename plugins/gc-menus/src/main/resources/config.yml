# Mundo onde as torres moram e ate onde varrer atras delas.
mundo: ilha
alcance-da-varredura: 288

# Nenhuma area fica de fora da varredura: o que as areas de construcao liberam
# e o chao em volta, nao a torre. A coluna do sinalizador continua travada
# dentro delas — foi o que o Julio pediu depois de ver que dava para construir
# em cima do beacon.
areas-fora: []

# Torres protegidas: uma linha "x,z" por sinalizador. Quem escreve isto e o
# comando /torres, varrendo o mapa — manter a lista a mao nao funcionou: eu
# tinha 48 numa ilha com 116, e as outras ficavam sem protecao sem ninguem
# perceber.
#
# A protecao e uma coluna de 7x7 centrada no sinalizador, tres blocos para cada
# lado, do fundo do mundo ate o teto. Dentro dela ninguem quebra nem coloca
# bloco, nem por explosao, fogo ou balde. Quem esta com /obras ligado passa.
torres: []

# Areas de construcao do MegaGames: dentro delas ninguem quebra o que ja estava
# no mapa, mas todo mundo pode colocar bloco e derrubar o que colocou. A coluna
# das torres continua intocavel mesmo aqui dentro.
# Formato "minx,miny,minz,maxx,maxy,maxz".
areas-construcao:
  - "26,67,-207,65,90,-183"
  - "-26,65,190,12,88,214"
