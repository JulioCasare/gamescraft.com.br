# This is the Bukkit commands configuration file for Paper.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/bukkit-commands-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  icanhasbukkit:
  - version $1-
  # /npc lobby cria o boneco de volta ao lobby, onde voce esta e virado para
  # onde voce olha. /npcapagar tira o mais proximo; /npcs lista os nomes.
  npc:
  - function gcnpc:criar_$1
  npcapagar:
  - function gcnpc:apagar
  npcs:
  - function gcnpc:lista
  # /emote <nome> roda o emote. /emotes lista os que existem.
  emote:
  - function gcemote:$1
  emotes:
  - function gcemote:lista
  # /obras pausa a protecao para editar torre e area. Desligando, o estado novo
  # vira a referencia.
  obras:
  - trigger obras
  # O /save e o /reset sairam daqui: eles agora sao do plugin, e trocam a pasta
  # do mundo em vez de copiar bloco a bloco. Um levava mais de um minuto na ilha
  # inteira; o outro leva um ou dois segundos.
  #
  # O /arena1 e o /arena2 sairam junto: nao ha mais area a marcar dentro de um
  # mapa, porque a arena passou a ser o mundo inteiro.
