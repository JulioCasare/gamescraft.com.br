name: game-craft-beta

services:
  proxy:
    # Velocity "latest" e compilado para Java 25; imagem java21 nao o carrega.
    image: itzg/mc-proxy:java25
    restart: unless-stopped
    environment:
      TYPE: VELOCITY
      # Versao presa, e nao "latest", desde 2026-08-11: o build 19 saiu naquele
      # dia e quebrou o registro de listener de todo plugin do proxy — Geyser e
      # Floodgate param de subir, e a rede fica sem Bedrock. O pior e que isso
      # nao acontece quando a gente mexe em nada: basta reiniciar o proxy num dia
      # em que saiu snapshot novo. O 16 e o ultimo que funciona.
      # Antes de subir esse numero, teste o Bedrock e procure no log do proxy:
      # "Started Geyser on UDP port 19132".
      VELOCITY_VERSION: "4.1.0-SNAPSHOT"
      VELOCITY_BUILD_ID: "16"
      MEMORY: "${MEMORY_PROXY:-1G}"
      REPLACE_ENV_VARIABLES: "false"
      PLUGINS_FILE: /server/plugins.txt
    ports:
      - "${JAVA_PORT:-25565}:25565/tcp"
      - "${BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - gc_proxy:/server
    networks:
      - gamecraft
    depends_on:
      lobby:
        condition: service_started

  lobby:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-26.2}"
      MEMORY: "${MEMORY_LOBBY:-1500M}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft Lobby"
      MOTD: "Game Craft | Lobby beta"
      # Beta fechado: so entra quem esta na whitelist. Sair do beta e trocar
      # BETA_WHITELIST para FALSE em infra/.env e reiniciar a rede.
      # ENFORCE derruba quem ja estiver dentro e sair da lista.
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "50"
      MODE: adventure
      DIFFICULTY: peaceful
      PVP: "false"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_lobby:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  bedwars:
    # Java 21 basta aqui: so o Paper 26.x exige Java 25, e este backend e 1.20.4.
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # O BedWars fica numa versao propria: o BedWars1058 usa NMS e so roda
      # nas versoes que suporta. O ViaVersion neste backend deixa os clientes
      # mais novos (e o Geyser) entrarem mesmo assim.
      VERSION: "${MINECRAFT_VERSION_BEDWARS:-1.20.4}"
      MEMORY: "${MEMORY_BEDWARS:-2500M}"
      # Mundo void: fora do mapa de BedWars nao gera terreno nenhum — cair do
      # mapa e cair no vazio. Vale so na criacao do mundo (fica no level.dat).
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"biome":"minecraft:the_void","layers":[]}'
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft BedWars"
      MOTD: "Game Craft | BedWars beta"
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "32"
      MODE: adventure
      DIFFICULTY: normal
      PVP: "true"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_bedwars:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  pillars:
    # Java 25 mesmo rodando 1.21.11: o WorldEdit 7.4.4 e compilado para Java 25
    # e nao carrega em Java 21. O Paper 1.21.x roda normalmente em Java 25.
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      # Versao propria, presa ao FortunePillars (suporta ate 1.21.11).
      # O ViaVersion neste backend deixa clientes 26.2 e o Geyser entrarem.
      VERSION: "${MINECRAFT_VERSION_PILLARS:-1.21.11}"
      MEMORY: "${MEMORY_PILLARS:-1500M}"
      # Mundo void: os pilares flutuam sobre o vazio, e cair do pilar e a
      # principal forma de morrer no modo. Vale so na criacao do mundo.
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"biome":"minecraft:the_void","layers":[]}'
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft Pillars"
      MOTD: "Game Craft | Pillars of Fortune beta"
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "24"
      MODE: adventure
      DIFFICULTY: normal
      PVP: "true"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_pillars:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  buildbattle:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-26.2}"
      MEMORY: "${MEMORY_BUILDBATTLE:-1500M}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft Build Battle"
      MOTD: "Game Craft | Build Battle beta"
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "24"
      MODE: adventure
      DIFFICULTY: peaceful
      PVP: "false"
      # O plugin de Build Battle coloca o jogador em criativo dentro da parcela.
      # Sem allow-flight o Paper expulsa quem estiver voando.
      ALLOW_FLIGHT: "TRUE"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_buildbattle:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  ctf:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-26.2}"
      MEMORY: "${MEMORY_CTF:-1500M}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      # O identificador continua `ctf` — e o nome pelo qual o proxy roteia
      # (/server ctf), o nome do volume e o nome nos scripts. Trocar isso
      # quebraria os tres de uma vez; o que o jogador ve e o nome abaixo.
      SERVER_NAME: "Game Craft MegaGames"
      MOTD: "Game Craft | MegaGames beta"
      # Mapa proprio: uma ilha construida a mao num mar plano. O mundo `ilha`
      # nasce so de mar — bedrock, pedra ate y=50 e agua ate y=62 — e a ilha em
      # si e desenhada por cima com o WorldEdit. Bioma de planicie no mundo
      # inteiro para a grama sair verde: com bioma de oceano ela puxa para o
      # azul. O mapa Island que veio pronto continua guardado no mundo `world`.
      LEVEL: "ilha"
      LEVEL_TYPE: "minecraft:flat"
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":114},{"block":"minecraft:water","height":12}],"biome":"minecraft:plains"}'
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "24"
      MODE: adventure
      DIFFICULTY: normal
      PVP: "true"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_ctf:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  pvp:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-26.2}"
      MEMORY: "${MEMORY_PVP:-1500M}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft PvP"
      MOTD: "Game Craft | PvP beta"
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "24"
      # Survival, nao adventure: o kit tem blocos, baldes, TNT e teia, e em
      # adventure nada disso pode ser colocado. Quem entra na area segura vira
      # adventure pelo datapack e volta a survival ao sair.
      MODE: survival
      DIFFICULTY: normal
      PVP: "true"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_pvp:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  # Servidor dos eventos que voce mesmo conduz: lava sobe, corrida, quiz.
  # Nao sobe junto com a rede; use scripts/event.sh no dia do evento.
  eventos:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MINECRAFT_VERSION:-26.2}"
      MEMORY: "${MEMORY_EVENTOS:-2G}"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      # Permite mandar comandos de admin sem RCON:
      # docker exec <container> mc-send-to-console <comando>
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      SERVER_NAME: "Game Craft Eventos"
      MOTD: "Game Craft | Evento"
      ENABLE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      ENFORCE_WHITELIST: "${BETA_WHITELIST:-TRUE}"
      MAX_PLAYERS: "60"
      # Survival para o jogador poder ser afetado pelo evento: queimar, cair,
      # levar dano. Em adventure ele nao quebra bloco e a lava nao o mata igual.
      MODE: survival
      DIFFICULTY: normal
      PVP: "true"
      # Voce precisa de voo para montar e acompanhar o evento de cima.
      ALLOW_FLIGHT: "TRUE"
      # Sem mob natural em servidor de minigame: monstro atrapalha partida e come
      # CPU a toa. Nao afeta mob que plugin invoca (ex.: Dream Defender).
      SPAWN_MONSTERS: "FALSE"
      SPAWN_ANIMALS: "FALSE"
      ALLOW_NETHER: "false"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      # O mapa e trocado por scripts/event.sh, nao gerado pelo servidor.
      LEVEL_TYPE: FLAT
      GENERATE_STRUCTURES: "false"
      PLUGINS_FILE: /data/plugins.txt
    expose:
      - "25565"
    volumes:
      - gc_eventos:/data
    networks:
      - gamecraft
    depends_on:
      database:
        condition: service_healthy

  # Tunel para amigos de fora da rede de casa. O agente conversa com o playit
  # e entrega o trafego ao proxy por dentro da rede do Docker, entao o IP da
  # casa nunca aparece para quem entra. Sem PLAYIT_SECRET no .env ele nao sobe.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: "${PLAYIT_SECRET}"
    # Compartilha a rede do proxy: assim 127.0.0.1 dentro do agente E o proxy,
    # e os tuneis do painel funcionam com o endereco local padrao, sem precisar
    # descobrir IP de container (que muda a cada recriacao).
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started

  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DATABASE_NAME}"
      MARIADB_USER: "${DATABASE_USER}"
      MARIADB_PASSWORD: "${DATABASE_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DATABASE_ROOT_PASSWORD}"
    volumes:
      - gc_mariadb:/var/lib/mysql
    networks:
      - gamecraft
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  gamecraft:
    driver: bridge

# Os dados dos servidores vivem em volumes do Docker, dentro do disco Linux do
# WSL — nao em pasta do Windows. O compartilhamento de arquivos do Docker
# Desktop com o disco D: colapsava depois de algumas horas de escrita e
# derrubava a rede (arquivo corrompido, container que nao sobe, erro de
# leitura no proprio JAR). Sem bind, esse caminho deixa de existir.
#
# Para mexer nos arquivos de dentro:
#   docker exec game-craft-beta-<modo>-1 ls /data
#   docker cp <origem> game-craft-beta-<modo>-1:/data/<destino>
# E para copiar algo de volta para o Windows:
#   docker cp game-craft-beta-<modo>-1:/data/<arquivo> .
volumes:
  gc_proxy:
    external: true
  gc_lobby:
    external: true
  gc_bedwars:
    external: true
  gc_pillars:
    external: true
  gc_buildbattle:
    external: true
  gc_ctf:
    external: true
  gc_pvp:
    external: true
  gc_eventos:
    external: true
  gc_mariadb:
    external: true
