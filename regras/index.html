<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regras — Game Craft</title>
<!--
  Esta pasta existe só para o endereço sem "#" funcionar.

  O site é uma página só, com roteamento por âncora: as regras vivem em
  /#/regras. Só que ninguém digita o "#" — quem cola o endereço num chat ou
  numa descrição de vídeo escreve gamescraft.com.br/regras, e isso dava 404.

  O GitHub Pages serve esta pasta como /regras e como /regras/, então as duas
  formas passam a cair no lugar certo. A troca é feita pelo script; o
  http-equiv fica como reserva para quem estiver com script desligado, e o
  link abaixo para quem não tiver nem isso.
-->
<meta http-equiv="refresh" content="0; url=/#/regras">
<link rel="canonical" href="https://gamescraft.com.br/#/regras">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #11100f;
    color: #efe9e1;
    text-align: center;
    padding: 24px;
  }
  a { color: #e3a94a; }
</style>
</head>
<body>
  <p>Levando você às regras…<br>
    <a href="/#/regras">Clique aqui se não for sozinho.</a></p>
  <script>location.replace("/#/regras");</script>
</body>
</html>
